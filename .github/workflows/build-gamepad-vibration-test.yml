name: Build gamepad-vibration-test (fork)

# Publishes tools/gamepad-vibration-test as a self-contained single-file
# .exe, so it can be downloaded and run directly on a Windows machine
# that has no .NET SDK installed (only the runtime bundled by Apollo's
# own installer, which isn't enough to build anything). Manual trigger
# only - this is a throwaway diagnostic tool, not part of the normal
# Apollo build/release pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows-AMD64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: |
          dotnet publish tools/gamepad-vibration-test/gamepad-vibration-test.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamepad-vibration-test
          path: artifacts/gamepad-vibration-test.exe
          if-no-files-found: error
